
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RESTRICTED ACCESS | THE UNKNOWN ARCHIVE</title>
  <style>
    body {
      margin: 0;
      padding: 30px 18px;
      background: #100e10;
      color: #ded6d0;
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
    }
    h1 { font-weight: normal; letter-spacing: .1em; }
    .eyebrow {
      color: #b59a87;
      letter-spacing: .2em;
      font-size: .8rem;
    }
    .panel {
      background: #191518;
      border: 1px solid #514047;
      padding: 24px;
      margin: 25px 0;
    }
    label {
      display: block;
      margin: 16px 0 8px;
    }
    input, textarea, select {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      color: #eee;
      background: #100e10;
      border: 1px solid #514047;
      font: inherit;
    }
    textarea { min-height: 180px; resize: vertical; }
    button {
      padding: 11px 16px;
      margin-top: 14px;
      color: #eee;
      background: #382a32;
      border: 1px solid #8b6d78;
      cursor: pointer;
      font: inherit;
    }
    .delete-button { background: #211619; }
    .news-entry {
      border-top: 1px solid #514047;
      padding: 16px 0;
      overflow-wrap: anywhere;
    }
    a { color: #d4b69e; }
    #status { white-space: pre-wrap; line-height: 1.7; }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">THE UNKNOWN ARCHIVE</p>
  <h1>RESTRICTED ACCESS</h1>
  <p>관리자 전용 기록실</p>
  <p><a href="index.html">← 메인으로 돌아가기</a></p>

  <section class="panel" id="login-panel">
    <h2>관리자 로그인</h2>
    <form id="login-form">
      <label for="email">관리자 이메일</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">비밀번호</label>
      <input id="password" type="password"
        autocomplete="current-password" required>

      <button type="submit">로그인</button>
    </form>
  </section>

  <section class="panel" id="editor-panel" hidden>
    <h2>새 기록 작성</h2>
    <form id="news-form">
      <label for="category">소식 종류</label>
      <select id="category" required>
        <option value="공지">공지</option>
        <option value="세계관 소식">세계관 소식</option>
        <option value="업데이트">업데이트</option>
        <option value="캐릭터 추가">캐릭터 추가</option>
      </select>

      <label for="title">제목</label>
      <input id="title" maxlength="150" required>

      <label for="body">내용</label>
      <textarea id="body" maxlength="10000" required></textarea>

      <button type="submit">소식 게시하기</button>
    </form>

    <button id="logout-button" type="button">로그아웃</button>
    <h2>등록된 소식</h2>
    <div id="admin-news-list">기록을 불러오는 중...</div>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const archiveClient = window.archiveSupabase;
const loginPanel = document.getElementById("login-panel");
const editorPanel = document.getElementById("editor-panel");
const statusBox = document.getElementById("status");
const newsList = document.getElementById("admin-news-list");
const ADMIN_EMAIL = "inoejoha@gmail.com";

function showStatus(message) {
  statusBox.textContent = message;
}

function showLoggedIn(isLoggedIn) {
  loginPanel.hidden = isLoggedIn;
  editorPanel.hidden = !isLoggedIn;
}

async function refreshSession() {
  const { data, error } = await archiveClient.auth.getSession();

  if (error) {
    showStatus("로그인 상태를 확인하지 못했습니다.");
    showLoggedIn(false);
    return;
  }

  const session = data.session;
  const isAdmin =
    !!session && session.user.email === ADMIN_EMAIL;

  showLoggedIn(isAdmin);

  if (session && !isAdmin) {
    await archiveClient.auth.signOut();
    showStatus("관리자 계정이 아닙니다.");
    return;
  }

  if (isAdmin) {
    showStatus("관리자 인증 완료.");
    await loadAdminNews();
  }
}

document.getElementById("login-form").addEventListener(
  "submit", async event => {
    event.preventDefault();
    showStatus("로그인 확인 중...");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await archiveClient.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      showStatus("로그인에 실패했습니다. 이메일과 비밀번호를 확인해 주세요.");
      return;
    }

    await refreshSession();
  }
);

document.getElementById("news-form").addEventListener(
  "submit", async event => {
    event.preventDefault();

    const { data: sessionData, error: sessionError } =
      await archiveClient.auth.getSession();

    if (sessionError) {
      showStatus("로그인 상태를 확인하지 못했습니다.");
      return;
    }

    const user = sessionData.session?.user;

    if (!user || user.email !== ADMIN_EMAIL) {
      showStatus("관리자 로그인 후 이용해 주세요.");
      return;
    }

    const category = document.getElementById("category").value;
    const title = document.getElementById("title").value.trim();
    const body = document.getElementById("body").value.trim();

    if (!title || !body) {
      showStatus("제목과 내용을 모두 입력해 주세요.");
      return;
    }

    const { error } = await archiveClient
      .from("archive_news")
      .insert({ category, title, body });

    if (error) {
      console.error("소식 게시 오류:", error);
      showStatus(
        "게시 실패: " + error.message +
        "\n오류 코드: " + (error.code || "없음") +
        "\n상세 내용: " + (error.details || "없음")
      );
      return;
    }

    document.getElementById("news-form").reset();
    showStatus("소식을 게시했습니다.");
    await loadAdminNews();
  }
);

async function loadAdminNews() {
  const { data, error } = await archiveClient
    .from("archive_news")
    .select("id, category, title, body, created_at")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("소식 목록 오류:", error);
    showStatus("소식 목록을 불러오지 못했습니다.");
    return;
  }

  newsList.replaceChildren();

  if (!data || data.length === 0) {
    newsList.textContent = "아직 등록된 소식이 없습니다.";
    return;
  }

  for (const item of data) {
    const entry = document.createElement("article");
    entry.className = "news-entry";

    const heading = document.createElement("h3");
    heading.textContent = item.title;

    const meta = document.createElement("p");
    meta.textContent =
      item.category + " · " +
      new Date(item.created_at).toLocaleDateString("ko-KR");

    const bodyElement = document.createElement("p");
    bodyElement.textContent = item.body;

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "delete-button";
    deleteButton.textContent = "이 소식 삭제";

    deleteButton.addEventListener("click", async () => {
      if (!confirm("이 소식을 삭제할까요?")) return;

      const { data: sessionData, error: sessionError } =
        await archiveClient.auth.getSession();

      const user = sessionData?.session?.user;

      if (sessionError || !user || user.email !== ADMIN_EMAIL) {
        showStatus("관리자 로그인이 필요합니다.");
        return;
      }

      const { error } = await archiveClient
        .from("archive_news")
        .delete()
        .eq("id", item.id);

      if (error) {
        console.error("소식 삭제 오류:", error);
        showStatus("삭제하지 못했습니다: " + error.message);
        return;
      }

      showStatus("소식을 삭제했습니다.");
      await loadAdminNews();
    });

    entry.append(heading, meta, bodyElement, deleteButton);
    newsList.append(entry);
  }
}

document.getElementById("logout-button").addEventListener(
  "click", async () => {
    await archiveClient.auth.signOut();
    showLoggedIn(false);
    showStatus("로그아웃했습니다.");
  }
);

archiveClient.auth.onAuthStateChange(() => {
  refreshSession();
});

refreshSession();
</script>
</body>
</html>
